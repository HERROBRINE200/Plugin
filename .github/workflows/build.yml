name: Build High Energy

on:
  push:
    branches: [ "arena/01a10beb-plugin", "main" ]
    paths-ignore: [ "ci-log/**", "dist/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric:
    name: Fabric mod (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
      - name: Build
        working-directory: source/HighEnergy-Fabric
        run: gradle build --no-daemon --stacktrace
      - name: Collect artifact
        run: |
          mkdir -p dist
          ls -l source/HighEnergy-Fabric/build/libs
          cp "$(ls source/HighEnergy-Fabric/build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -1)" dist/HighEnergy-Mod.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HighEnergy-Mod
          path: dist/HighEnergy-Mod.jar
      - name: Commit artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f dist/HighEnergy-Mod.jar
          git commit -m "ci: Fabric mod jar [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 7
          done

  paper:
    name: Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        working-directory: source/HighEnergy-Paper
        run: gradle build --no-daemon --stacktrace
      - name: Collect artifact
        run: |
          mkdir -p dist
          ls -l source/HighEnergy-Paper/build/libs
          cp source/HighEnergy-Paper/build/libs/HighEnergy-Plugin.jar dist/HighEnergy-Plugin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HighEnergy-Plugin
          path: dist/HighEnergy-Plugin.jar
      - name: Commit artifact
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f dist/HighEnergy-Plugin.jar
          git commit -m "ci: Paper plugin jar [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 7
          done
