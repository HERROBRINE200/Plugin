name: Build High Energy

on:
  push:
    branches: [ "arena/01a10beb-plugin", "main" ]
    paths-ignore: [ "ci-log/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric:
    name: Fabric mod (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'
      - name: Build
        id: build
        working-directory: source/HighEnergy-Fabric
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-log"
          gradle build --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/ci-log/fabric.log"
      - name: Inspect Minecraft API (debug)
        if: always()
        run: |
          MC=$(find ~/.gradle/caches -name "minecraft-merged*.jar" | head -1)
          echo "minecraft jar: $MC" >> ci-log/api.txt
          for C in net.minecraft.world.entity.EntityType net.minecraft.commands.CommandSourceStack; do
            echo "=== $C" >> ci-log/api.txt
            javap -classpath "$MC" $C 2>&1 | grep -iE "lightning|permission|public static final" | head -40 >> ci-log/api.txt
          done
          echo "=== references" >> ci-log/api.txt
          unzip -l "$MC" | grep -iE "references/|LightningBolt" | head -20 >> ci-log/api.txt
      - name: Publish build log
        if: always()
        run: |
          mkdir -p ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tail -c 60000 ci-log/fabric.log > ci-log/fabric-tail.log || true
          rm -f ci-log/fabric.log
          git add -f ci-log/fabric-tail.log ci-log/api.txt
          git commit -m "ci: fabric build log [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Rename artifact
        working-directory: source/HighEnergy-Fabric
        run: |
          ls -l build/libs
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -1)" HighEnergy-Mod.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HighEnergy-Mod
          path: source/HighEnergy-Fabric/HighEnergy-Mod.jar

  paper:
    name: Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        working-directory: source/HighEnergy-Paper
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HighEnergy-Plugin
          path: source/HighEnergy-Paper/build/libs/HighEnergy-Plugin.jar
