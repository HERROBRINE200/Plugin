name: Build High Energy

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a10bee-plugin

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Build Fabric mod
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon -p source/HighEnergy-Fabric clean build 2>&1 | tee fabric-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Fabric build failure'
              echo '```text'
              tail -n 180 fabric-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -c 9000 fabric-build.log)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error title=Fabric compiler output::$diagnostic"
          fi
          exit "$status"

      - name: Build Paper plugin
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon -p source/HighEnergy-Paper clean build 2>&1 | tee paper-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Paper build failure'
              echo '```text'
              tail -n 180 paper-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -c 9000 paper-build.log)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error title=Paper compiler output::$diagnostic"
          fi
          exit "$status"

      - name: Assemble exact final package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work HighEnergy-Final.zip
          mkdir -p release-work/HighEnergy-Final/{1-Mod,2-Plugin,3-Source-Code}
          cp source/HighEnergy-Fabric/build/libs/HighEnergy-Mod.jar \
            release-work/HighEnergy-Final/1-Mod/HighEnergy-Mod.jar
          cp source/HighEnergy-Paper/build/libs/HighEnergy-Plugin.jar \
            release-work/HighEnergy-Final/2-Plugin/HighEnergy-Plugin.jar
          cp release/README.md release-work/HighEnergy-Final/README.md

          fabric_zip="$PWD/release-work/HighEnergy-Final/3-Source-Code/HighEnergy-Fabric-Source.zip"
          paper_zip="$PWD/release-work/HighEnergy-Final/3-Source-Code/HighEnergy-Paper-Source.zip"
          (cd source && zip -q -r "$fabric_zip" HighEnergy-Fabric \
            -x 'HighEnergy-Fabric/build/*' 'HighEnergy-Fabric/.gradle/*')
          (cd source && zip -q -r "$paper_zip" HighEnergy-Paper \
            -x 'HighEnergy-Paper/build/*' 'HighEnergy-Paper/.gradle/*')
          (cd release-work && zip -q -r "$OLDPWD/HighEnergy-Final.zip" HighEnergy-Final)

      - name: Verify JARs and ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -t HighEnergy-Final.zip
          jar tf release-work/HighEnergy-Final/1-Mod/HighEnergy-Mod.jar | grep -Fx fabric.mod.json
          jar tf release-work/HighEnergy-Final/2-Plugin/HighEnergy-Plugin.jar | grep -Fx plugin.yml
          unzip -p release-work/HighEnergy-Final/2-Plugin/HighEnergy-Plugin.jar plugin.yml | grep -F "api-version: '26.2'"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              'HighEnergy-Final/1-Mod/HighEnergy-Mod.jar',
              'HighEnergy-Final/2-Plugin/HighEnergy-Plugin.jar',
              'HighEnergy-Final/3-Source-Code/HighEnergy-Fabric-Source.zip',
              'HighEnergy-Final/3-Source-Code/HighEnergy-Paper-Source.zip',
              'HighEnergy-Final/README.md',
          }
          with ZipFile('HighEnergy-Final.zip') as archive:
              names = set(archive.namelist())
              missing = expected - names
              if missing:
                  raise SystemExit(f'Missing final entries: {sorted(missing)}')
              for name in expected:
                  if archive.getinfo(name).file_size == 0:
                      raise SystemExit(f'Empty deliverable: {name}')
              extras = [name for name in names if not name.endswith('/') and name not in expected]
              if extras:
                  raise SystemExit(f'Unexpected final files: {sorted(extras)}')
          print('Final ZIP structure and non-empty deliverables verified.')
          PY
          unzip -l HighEnergy-Final.zip
          sha256sum HighEnergy-Final.zip \
            release-work/HighEnergy-Final/1-Mod/HighEnergy-Mod.jar \
            release-work/HighEnergy-Final/2-Plugin/HighEnergy-Plugin.jar

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HighEnergy-Final
          path: HighEnergy-Final.zip
          if-no-files-found: error
          retention-days: 30
